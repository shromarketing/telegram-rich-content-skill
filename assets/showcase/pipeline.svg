<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Telegram Rich Content workflow</title>
  <desc id="desc">Source material flows through evidence and editorial steps to validated plain, album, or rich Telegram output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102f55"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#51c8ff" stroke-width="2"/></marker>
  </defs>
  <rect width="1440" height="420" rx="30" fill="url(#bg)"/>
  <text x="70" y="72" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">One source → a traceable Telegram material</text>
  <text x="70" y="106" fill="#9fb8d3" font-family="Inter,Arial,sans-serif" font-size="16">Editorial judgment stays human-readable. Risky actions stay explicitly gated.</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(70 160)"><rect width="230" height="150" rx="20" fill="#132d4a" stroke="#2c6a98"/><text x="24" y="42" fill="#6dd5ff" font-size="15" font-weight="700">01 · SOURCE</text><text x="24" y="78" fill="#fff" font-size="20" font-weight="700">Idea · Audio</text><text x="24" y="108" fill="#fff" font-size="20" font-weight="700">Article · Video</text><text x="24" y="134" fill="#9fb8d3" font-size="14">Local or lawful public input</text></g>
    <g transform="translate(375 160)"><rect width="230" height="150" rx="20" fill="#132d4a" stroke="#2c6a98"/><text x="24" y="42" fill="#6dd5ff" font-size="15" font-weight="700">02 · GROUND</text><text x="24" y="78" fill="#fff" font-size="20" font-weight="700">Transcript</text><text x="24" y="108" fill="#fff" font-size="20" font-weight="700">Evidence map</text><text x="24" y="134" fill="#9fb8d3" font-size="14">Facts, quotes, timestamps</text></g>
    <g transform="translate(680 160)"><rect width="230" height="150" rx="20" fill="#132d4a" stroke="#2c6a98"/><text x="24" y="42" fill="#6dd5ff" font-size="15" font-weight="700">03 · SHAPE</text><text x="24" y="78" fill="#fff" font-size="20" font-weight="700">Brief + voice</text><text x="24" y="108" fill="#fff" font-size="20" font-weight="700">Plain + Rich</text><text x="24" y="134" fill="#9fb8d3" font-size="14">Meaning before decoration</text></g>
    <g transform="translate(985 160)"><rect width="385" height="150" rx="20" fill="#0e73ac" stroke="#69d7ff"/><text x="24" y="42" fill="#bceeff" font-size="15" font-weight="700">04 · VERIFY &amp; DELIVER</text><text x="24" y="78" fill="#fff" font-size="20" font-weight="700">Strict validation → private test</text><text x="24" y="108" fill="#fff" font-size="20" font-weight="700">Separate production approval</text><text x="24" y="134" fill="#d8f5ff" font-size="14">Dry run is the default</text></g>
  </g>
  <g stroke="#51c8ff" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M315 235H355"/><path d="M620 235H660"/><path d="M925 235H965"/></g>
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#9fb8d3"><text x="70" y="365">Local Whisper</text><text x="375" y="365">Source-linked claims</text><text x="680" y="365">Explainable voice rules</text><text x="985" y="365">--send + exact --confirm-target</text></g>
</svg>
