name: Bug report
description: Report a reproducible problem without secrets or private material
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include bot tokens, cookies, private chat IDs, or customer content."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Skill behavior, Installation, YouTube, Transcription, Validation, Preview, Publishing, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic input
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private source material.
          required: true
